name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: go vet
        run: go vet ./...
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
          # Build with the setup-go toolchain: release binaries can lag the
          # Go version go.mod targets, and golangci-lint refuses to run then.
          install-mode: goinstall
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.10.0 ./...
      # Includes TestMigrationsMatchModels: models and SQL migrations must
      # produce the same schema.
      - name: go test
        run: go test -race ./...
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/app?sslmode=disable
          TEST_REDIS_URL: redis://localhost:6379/0
      - name: go build
        run: go build ./...

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: install
        run: bun install --frozen-lockfile
      - name: prettier
        run: bun run format:check
      - name: tests
        run: bun run test:frontend
      - name: build (includes typecheck)
        run: bun run frontend:build
      # The Go binary embeds the committed dist/, and Vite's output is
      # deterministic, so a fresh build must reproduce it byte for byte.
      - name: committed dist matches the source
        run: |
          git add --all web/frontend/dist
          git diff --cached --exit-code --stat web/frontend/dist || {
            echo "web/frontend/dist is stale: run 'bun run frontend:build' and commit it."
            exit 1
          }
      - name: Shopify config files parse
        run: bun run check:toml

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: docker build
        run: docker build -t shopify-go-app-template .
