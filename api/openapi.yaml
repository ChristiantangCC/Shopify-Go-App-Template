components:
  schemas:
    AppSubscription:
      additionalProperties: false
      properties:
        currentPeriodEnd:
          description: RFC 3339; empty when Shopify reports none.
          type: string
        id:
          type: string
        name:
          description: The plan name configured in managed pricing.
          type: string
        status:
          type: string
        test:
          type: boolean
      required:
        - id
        - name
        - status
        - test
        - currentPeriodEnd
      type: object
    BillingStatus:
      additionalProperties: false
      properties:
        pricingPlansUrl:
          description: Shopify's hosted plan picker; absent until SHOPIFY_APP_HANDLE is set.
          type: string
        subscriptions:
          items:
            $ref: "#/components/schemas/AppSubscription"
          type: array
      required:
        - subscriptions
      type: object
    BulkStarted:
      additionalProperties: false
      properties:
        operationId:
          description: Admin GraphQL id of the bulk operation.
          type: string
      required:
        - operationId
      type: object
    ErrorDetail:
      additionalProperties: false
      properties:
        location:
          description: Where the error occurred, e.g. 'body.items[3].tags' or 'path.thing-id'
          type: string
        message:
          description: Error message text
          type: string
        value:
          description: The value at the given location
      type: object
    ErrorModel:
      additionalProperties: false
      properties:
        detail:
          description: A human-readable explanation specific to this occurrence of the problem.
          examples:
            - Property foo is required but is missing.
          type: string
        errors:
          description: Optional list of individual error details
          items:
            $ref: "#/components/schemas/ErrorDetail"
          type: array
        instance:
          description: A URI reference that identifies the specific occurrence of the problem.
          examples:
            - https://example.com/error-log/abc123
          format: uri
          type: string
        status:
          description: HTTP status code
          examples:
            - 400
          format: int64
          type: integer
        title:
          description: A short, human-readable summary of the problem type. This value should not change between occurrences of the error.
          examples:
            - Bad Request
          type: string
        type:
          default: about:blank
          description: A URI reference to human-readable documentation for the error.
          examples:
            - https://example.com/errors/example
          format: uri
          type: string
      type: object
    Product:
      additionalProperties: false
      properties:
        handle:
          type: string
        id:
          description: Admin GraphQL id.
          type: string
        status:
          description: ACTIVE, ARCHIVED or DRAFT.
          type: string
        title:
          type: string
        totalInventory:
          format: int64
          type: integer
      required:
        - id
        - title
        - handle
        - status
        - totalInventory
      type: object
    ProductsPage:
      additionalProperties: false
      properties:
        endCursor:
          description: Pass as ?after= for the next page; empty on the last.
          type: string
        hasNextPage:
          type: boolean
        products:
          items:
            $ref: "#/components/schemas/Product"
          type: array
      required:
        - products
        - hasNextPage
        - endCursor
      type: object
    SessionInfo:
      additionalProperties: false
      properties:
        billingEnabled:
          description: Whether the billing pages are available.
          type: boolean
        isNew:
          description: True when this open installed (or reinstalled) the app.
          type: boolean
        shop:
          description: The shop's myshopify domain.
          type: string
      required:
        - shop
        - isNew
        - billingEnabled
      type: object
    Settings:
      additionalProperties: false
      properties:
        notificationEmail:
          type: string
        syncEnabled:
          type: boolean
      required:
        - notificationEmail
        - syncEnabled
      type: object
    SubscriptionState:
      additionalProperties: false
      properties:
        topics:
          additionalProperties:
            type: boolean
          description: Topic (like products/create) to subscribed.
          type: object
      required:
        - topics
      type: object
    SubscriptionToggle:
      additionalProperties: false
      properties:
        subscribed:
          type: boolean
        topic:
          description: A dynamic registry topic, like products/create.
          examples:
            - products/create
          type: string
      required:
        - topic
        - subscribed
      type: object
  securitySchemes:
    apiKey:
      description: A server-to-server key from API_KEY or API_KEYS.
      scheme: bearer
      type: http
    sessionToken:
      bearerFormat: JWT
      description: "App Bridge session token: `await shopify.idToken()`."
      scheme: bearer
      type: http
info:
  title: Shopify Go App Template API
  version: 1.0.0
openapi: 3.1.0
paths:
  /api/admin/billing/status:
    get:
      operationId: getBillingStatus
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BillingStatus"
          description: OK
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: "Unauthorized: missing or invalid credentials, or the shop needs a new token exchange"
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
        "502":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Bad Gateway
      security:
        - sessionToken: []
      summary: The shop's active app subscriptions
      tags:
        - admin
  /api/admin/bulk/products:
    post:
      operationId: startProductsBulk
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkStarted"
          description: Accepted
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: "Unauthorized: missing or invalid credentials, or the shop needs a new token exchange"
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
        "502":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Bad Gateway
      security:
        - sessionToken: []
      summary: Start the demo bulk product export
      tags:
        - admin
  /api/admin/products:
    get:
      operationId: listProducts
      parameters:
        - description: Cursor from the previous page's endCursor.
          explode: false
          in: query
          name: after
          schema:
            description: Cursor from the previous page's endCursor.
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductsPage"
          description: OK
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: "Unauthorized: missing or invalid credentials, or the shop needs a new token exchange"
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
        "502":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Bad Gateway
      security:
        - sessionToken: []
      summary: List the shop's products, 20 per page
      tags:
        - admin
  /api/admin/session:
    post:
      operationId: bootstrapSession
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionInfo"
          description: OK
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: "Unauthorized: missing or invalid credentials, or the shop needs a new token exchange"
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
        "502":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Bad Gateway
      security:
        - sessionToken: []
      summary: Bootstrap the shop's session on app open
      tags:
        - admin
  /api/admin/settings:
    get:
      operationId: getSettings
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"
          description: OK
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: "Unauthorized: missing or invalid credentials, or the shop needs a new token exchange"
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - sessionToken: []
      summary: The shop's settings, or the defaults
      tags:
        - admin
    put:
      operationId: saveSettings
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Settings"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"
          description: OK
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: "Unauthorized: missing or invalid credentials, or the shop needs a new token exchange"
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      security:
        - sessionToken: []
      summary: Save the shop's settings
      tags:
        - admin
  /api/admin/webhooks/subscriptions:
    get:
      operationId: listWebhookSubscriptions
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriptionState"
          description: OK
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: "Unauthorized: missing or invalid credentials, or the shop needs a new token exchange"
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
        "502":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Bad Gateway
      security:
        - sessionToken: []
      summary: The shop's subscription state for every dynamic topic
      tags:
        - admin
    post:
      operationId: toggleWebhookSubscription
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubscriptionToggle"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriptionToggle"
          description: OK
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Bad Request
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: "Unauthorized: missing or invalid credentials, or the shop needs a new token exchange"
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
        "502":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Bad Gateway
      security:
        - sessionToken: []
      summary: Subscribe or unsubscribe one dynamic topic
      tags:
        - admin
  /api/service/products:
    get:
      operationId: serviceListProducts
      parameters:
        - description: The shop's myshopify domain.
          explode: false
          in: query
          name: shop
          required: true
          schema:
            description: The shop's myshopify domain.
            examples:
              - example-shop.myshopify.com
            type: string
        - description: Cursor from the previous page's endCursor.
          explode: false
          in: query
          name: after
          schema:
            description: Cursor from the previous page's endCursor.
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductsPage"
          description: OK
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Bad Request
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: "Unauthorized: missing or invalid credentials, or the shop needs a new token exchange"
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
        "502":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Bad Gateway
      security:
        - apiKey: []
      summary: List a shop's products, 20 per page
      tags:
        - service
