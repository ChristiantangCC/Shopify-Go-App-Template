version: "2"
sql:
  - engine: "postgresql"
    queries: "internal/store/queries"
    schema: "internal/db/migrations"
    gen:
      go:
        package: "storegen"
        out: "internal/store/gen"
        sql_package: "pgx/v5"
        overrides:
          - db_type: "timestamptz"
            go_type: "time.Time"
          - db_type: "timestamptz"
            nullable: true
            go_type:
              import: "time"
              type: "Time"
              pointer: true
          - db_type: "text"
            nullable: true
            go_type:
              type: "string"
              pointer: true
