# Go hot reload for `bun run app:start:dev` (scripts/app-dev.sh runs
# `go tool air`). Rebuilds and restarts only the Go server on a change;
# the tunnel, Vite and the databases keep running. Dev only: air is never
# compiled into the server binary.
root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -o ./tmp/server ./cmd/server"
  entrypoint = ["./tmp/server"]
  # .sql: migrations are embedded, so a new one needs a rebuild too.
  include_ext = ["go", "sql"]
  exclude_dir = ["tmp", "node_modules", "web", "extensions", "scripts", ".shopify", "docs"]
  exclude_regex = ["_test\\.go$"]
  # SIGINT first, so the server drains and stops River cleanly.
  send_interrupt = true
  kill_delay = "5s"
  delay = 300
  stop_on_error = true

[log]
  main_only = true

[misc]
  clean_on_exit = true
